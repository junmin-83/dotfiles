[terminal]
shell = { program = "pwsh.exe" , args = ["-NoLogo", "-NoExit", "-Command", "Invoke-Expression (& { $PROFILE })"] }

[font]
normal = { family = "ZedMono Nerd Font", style = "Regular" }
bold = { family = "ZedMono Nerd Font", style = "Bold" }
italic = { family = "ZedMono Nerd Font", style = "Italic" }
bold_italic = { family = "ZedMono Nerd Font", style = "Bold Italic" }
size = 13.0

[general]
import = [
#    "c:\\Users\\junmi\\AppData\\Roaming\\Alacritty\\themes\\themes\\tokyo_night.toml"
    "c:\\Users\\junmi\\AppData\\Roaming\\Alacritty\\themes\\themes\\catppuccin-mocha.toml"
#    "c:\\Users\\junmi\\AppData\\Roaming\\Alacritty\\themes\\themes\\everforest_dark.toml"
]
working_directory = "d:\\Project\\"

[window]
dimensions = { columns = 120, lines = 35 }
padding = { x = 6, y = 6 }
dynamic_padding = true
decorations = "Full"
opacity = 0.97

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500

[scrolling]
history = 10000
multiplier = 3

[keyboard]
bindings = [
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" },
    { key = "F11", action = "ToggleFullscreen" },
    { key = "Space", mods = "Control|Shift", action = "ToggleViMode" }
]

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"
